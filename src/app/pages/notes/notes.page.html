<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Notes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Notes</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list lines="full">
    @for (note of notes; track note.createdAt) {
      <ion-item>
        <ion-label>
          <p class="note-body">{{ note.body }}</p>
          <ion-note>{{ note.editedAt | date: 'MMM d, h:mm a' }}</ion-note>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
